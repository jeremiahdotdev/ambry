version: "2"
sql:
  - engine: "postgresql"
    schema: "db/schema/schema.sql"
    queries:
      - "db/query/saints.sql"
      - "db/query/patronages.sql"
      - "db/query/religious_orders.sql"
      - "db/query/feast_days.sql"
    gen:
      go:
        package: "db"
        out: "internal/database/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
