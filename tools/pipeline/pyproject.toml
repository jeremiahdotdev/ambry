[project]
name = "catholic-sources-pipeline"
version = "0.1.0"
description = "Convert local Catholic source HTML files into JSON documents."
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "Pillow>=10.0.0",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
background-removal = [
    "onnxruntime>=1.18.0",
    "rembg>=2.0.0",
]

[project.scripts]
catholic-sources = "catholic_sources_pipeline.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
