version: "2"
sql:
  - engine: "postgresql"
    schema: "db/schema/schema.sql"
    queries:
      - "internal/repos/saint/sql/queries.sql"
      - "internal/repos/patronage/sql/queries.sql"
      - "internal/repos/religiousorder/sql/queries.sql"
      - "internal/repos/feastday/queries.sql"
    gen:
      go:
        package: "db"
        out: "internal/database/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
